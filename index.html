<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나뭇잎 마을</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="view"></canvas>

  <!-- 짓는 동안 -->
  <div id="loading">
    <svg class="leafmark spin" viewBox="0 0 100 100" aria-hidden="true"><use href="#leaf"/></svg>
    <p id="loadText">준비하는 중…</p>
  </div>

  <!-- 들어가기 전 / 잠시 멈춤: 펼친 두루마리 -->
  <aside id="menu" class="hidden">
    <div class="scroll">
      <div class="rod"></div>
      <div class="sheet">
        <header>
          <svg class="leafmark" viewBox="0 0 100 100" aria-hidden="true"><use href="#leaf"/></svg>
          <div>
            <p class="over">木ノ葉隠れの里</p>
            <h1>나뭇잎 마을</h1>
          </div>
          <span class="seal">火</span>
        </header>
        <p class="lede">호카게 바위 아래 마을을 걸어서 둘러봅니다. 관저·아카데미·이치라쿠 라멘, 나루토·사쿠라·이노의 집은 안으로 들어가 층마다 올라가 볼 수 있습니다.</p>

        <button id="enterBtn" class="enter">마을로 들어가기</button>

        <section>
          <h2>날씨</h2>
          <div id="weatherBtns" class="wxrow"></div>
        </section>

        <section class="two">
          <div>
            <h2>바람</h2>
            <div id="windBtns" class="seg"></div>
          </div>
          <div>
            <h2>소리</h2>
            <button id="muteBtn" class="toggle on">소리 켜짐</button>
          </div>
        </section>

        <section>
          <h2>바로 가기</h2>
          <div id="jumpBtns" class="tags"></div>
        </section>

        <footer>
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 걷기</span>
          <span><kbd>마우스</kbd> 둘러보기</span>
          <span><kbd>Shift</kbd> 달리기</span>
          <span><kbd>Space</kbd> 뛰기</span>
          <span><kbd>1</kbd>–<kbd>4</kbd> 날씨</span>
          <span><kbd>B</kbd> 바람</span>
          <span><kbd>M</kbd> 소리</span>
          <span><kbd>Esc</kbd> 이 두루마리</span>
        </footer>
      </div>
      <div class="rod"></div>
    </div>
  </aside>

  <!-- 걷는 동안 -->
  <div id="hud" class="hidden">
    <div id="placeCard">
      <b id="placeName"></b>
      <p id="placeText"></p>
    </div>
    <div class="status">
      <span><i>날씨</i><b id="wxNow"></b></span>
      <span><i>바람</i><b id="windNow"></b></span>
    </div>
    <div class="aim"></div>
  </div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- 나뭇잎 마을 표식: 안으로 말린 소용돌이와 왼쪽 아래로 뻗은 잎꼭지 -->
      <symbol id="leaf" viewBox="0 0 100 100">
        <path d="M51 51 C51 46 58 45 60 51 C63 60 52 66 44 61 C33 54 37 37 51 34 C68 31 80 46 76 62 C73 76 58 84 44 80 L20 90 L30 68 C22 56 23 40 33 30" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M70 22 L84 14 L80 30 Z" fill="currentColor"/>
      </symbol>
    </defs>
  </svg>
  <script type="module" src="js/main.js"></script>
</body>
</html>
